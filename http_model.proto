syntax = "proto3";

package core;

option go_package = "github.com/dangviethung096/core";

message Header {
  string key = 1;
  repeated string value = 2;
}

message QueryParam {
  string key = 1;
  repeated string value = 2;
}

message FormData {
  string key = 1;
  repeated string value = 2;
}

message Cookie {
  string name = 1;
  string value = 2;
  bool quoted = 3;        // indicates whether the Value was originally quoted
  string path = 4;        // optional
  string domain = 5;      // optional
  int64 expires = 6;      // Unix timestamp (time.Time)
  string raw_expires = 7; // for reading cookies only
  int32 max_age = 8;      // MaxAge=0 means no 'Max-Age' attribute specified
  bool secure = 9;
  bool http_only = 10;
  int32 same_site = 11; // SameSite enum as string
  bool partitioned = 12;
  string raw = 13;               // Raw cookie string
  repeated string unparsed = 14; // Raw text of unparsed attribute-value pairs
}

message Request {
  string url = 1;
  string method = 2;
  map<string, Header> headers = 3;
  bytes body = 4;
  map<string, QueryParam> queryParams = 5;
  map<string, string> urlParams = 6;
  string context_id = 7;
  map<string, string> data = 8;
  map<string, Cookie> cookies = 9;
  map<string, FormData> formData = 10;
}

message Response {
  map<string, Header> headers = 1;
  bytes response_body = 2;
  int32 status_code = 3;
  string redirect_link = 4;
}